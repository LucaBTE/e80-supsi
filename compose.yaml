name: e80kb-demo

services:
  neo4j:
    image: neo4j:2026.10.0
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    environment:
      NEO4J_AUTH: neo4j/e80-demo-password
    volumes:
      - demo-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p e80-demo-password 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  demo-neo4j-data:
