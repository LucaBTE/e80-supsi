[project]
name = "e80kb"
version = "0.1.0"
description = "GraphRAG knowledge base for the E80 IT department"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "neo4j>=6.0",
    "neo4j-graphrag[google-genai]>=1.21",
    "openpyxl>=3.1",
    "pydantic>=2.9",
    "pypdf>=6.0",
    "python-docx>=1.1",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
e80kb = "e80kb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
